name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
      - '.github/templates/build-and-push/**'
      - '.github/templates/deploy-backend-container/**'
      - '.github/templates/prune/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The e2e suite runs against a real mongod that mongodb-memory-server downloads on first
      # use. Caching it keeps that download off the critical path of every run.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Pre-download mongodb-memory-server binary
        run: node -e "require('mongodb-memory-server').MongoMemoryServer.create().then(s => s.stop())"

      - name: Run e2e tests
        run: pnpm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs:
      - test
    # One at a time, and a newer push waits rather than cancelling the one running: two would run
    # the same migrations at once, and a cancelled one could stop between migrating the database
    # and deploying the code that expects it.
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push
        uses: './.github/templates/build-and-push'
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Neither of these is a credential - the image is public and the account name is on
          # every tag. Only the token is a secret.
          dockerhub-username: ablaszkiewicz
          image-name: ablaszkiewicz/proke-backend
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # After the build, so a build that fails never leaves the database migrated for code that
      # never shipped, and before the deploy, so the new code never starts on data it does not
      # expect. A failure stops the job here and the backend already running carries on - which
      # is why every migration has to leave data it can still read. See
      # backend/src/migrations/migration.interface.ts.
      #
      # Straight from the runner: Mongo takes connections from outside the VPS. GitHub masks
      # the secret in the log, and the migrations print counts only, since the log is public.
      - name: Migrate
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          if [ -z "$MONGO_URL" ]; then
            echo "MONGO_URL is not set - refusing to fall back to a local database" >&2
            exit 1
          fi
          pnpm run migrate

      - name: Deploy
        uses: './.github/templates/deploy-backend-container'
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

          image-name: ablaszkiewicz/proke-backend
          container-name: proke-backend
          # Caddy holds :80 and :443 on this box and proxies to here. Same port either side,
          # published on loopback only - see the deploy template.
          server-port: 48211
          application-port: 48211

          mongo-url: ${{ secrets.MONGO_URL }}
          auth-jwt-secret: ${{ secrets.AUTH_JWT_SECRET }}
          state-signing-secret: ${{ secrets.STATE_SIGNING_SECRET }}
          app-url: ${{ secrets.APP_URL }}

          gh-app-id: ${{ secrets.GH_APP_ID }}
          gh-app-slug: ${{ secrets.GH_APP_SLUG }}
          gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-client-secret: ${{ secrets.GH_APP_CLIENT_SECRET }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          gh-app-webhook-secret: ${{ secrets.GH_APP_WEBHOOK_SECRET }}

          slack-client-id: ${{ secrets.SLACK_CLIENT_ID }}
          slack-client-secret: ${{ secrets.SLACK_CLIENT_SECRET }}
          slack-signing-secret: ${{ secrets.SLACK_SIGNING_SECRET }}
          slack-redirect-uri: ${{ secrets.SLACK_REDIRECT_URI }}
          # Falls back to the old secret name so the rename does not have to happen in the
          # same moment as this merge. Drop the fallback once TOKEN_ENCRYPTION_KEY is set.
          token-encryption-key: ${{ secrets.TOKEN_ENCRYPTION_KEY || secrets.SLACK_TOKEN_ENCRYPTION_KEY }}

          # Same project token the frontend bundle carries, so both halves of proke land in one
          # project. Unset simply means no analytics - the app boots either way.
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
          posthog-host: ${{ secrets.POSTHOG_HOST }}

      - name: Prune
        uses: './.github/templates/prune'
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
